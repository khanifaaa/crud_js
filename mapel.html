<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data Mapel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg bg-success" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Sekolah</a>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="beranda.html">Beranda</a></li>
            <li class="nav-item"><a class="nav-link" href="datasiswa.html">Siswa</a></li>
            <li class="nav-item"><a class="nav-link" href="guru.html">Guru</a></li>
            <li class="nav-item"><a class="nav-link active" href="mapel.html">Mapel</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- card tabel -->
    <div class="container mt-3">
      <div class="card border-success">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center rounded-top">
          <h5 class="mb-0">Data Mapel</h5>
          <button class="btn btn-sm btn-outline-light" data-bs-toggle="modal" data-bs-target="#modalTambah">Tambah</button>
        </div>
        <div class="card-body">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>No</th>
                <th>Nama Mapel</th>
                <th>Jenis Mapel</th>
                <th>KKM</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>Digital Marketing</td>
                <td>Produktif</td>
                <td>80</td>
                <td>
                  <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#modalUbah"
                    data-bs-nama="Digital Marketing" data-bs-jenis="Produktif" data-bs-kkm="80">Ubah</button>
                  <button class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#modalHapus"
                    data-bs-nama="Digital Marketing">Hapus</button>
                </td>
              </tr>
              <tr>
                <td>2</td>
                <td>Matematika</td>
                <td>Normatif</td>
                <td>85</td>
                <td>
                  <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#modalUbah"
                    data-bs-nama="Matematika" data-bs-jenis="Normatif" data-bs-kkm="85">Ubah</button>
                  <button class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#modalHapus"
                    data-bs-nama="Matematika">Hapus</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- modal tambah -->
    <div class="modal fade" id="modalTambah" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Tambah Mapel</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label class="form-label">Nama Mapel</label>
                <input type="text" class="form-control" id="tambahNama" />
              </div>
              <div class="mb-3">
                <label class="form-label">Jenis Mapel</label>
                <select class="form-select" id="tambahJenis">
                  <option>Normatif</option>
                  <option>Produktif</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">KKM</label>
                <input type="number" class="form-control" id="tambahKKM" />
              </div>
              <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button class="btn btn-primary">Simpan</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- modal ubah -->
    <div class="modal fade" id="modalUbah" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Ubah Mapel</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label class="form-label">Nama Mapel</label>
                <input type="text" class="form-control" id="ubahNama" />
              </div>
              <div class="mb-3">
                <label class="form-label">Jenis Mapel</label>
                <select class="form-select" id="ubahJenis">
                  <option>Normatif</option>
                  <option>Produktif</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">KKM</label>
                <input type="number" class="form-control" id="ubahKKM" />
              </div>
              <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button class="btn btn-primary">Simpan</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- modal hapus -->
    <div class="modal fade" id="modalHapus" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Hapus Data</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p>Apakah anda yakin ingin menghapus <strong><span id="hapusNama"></span></strong>?</p>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button class="btn btn-danger">Hapus</button>
          </div>
        </div>
      </div>
    </div>

    <!-- script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // isi otomatis modal ubah
      const modalUbah = document.getElementById("modalUbah");
      modalUbah.addEventListener("show.bs.modal", (event) => {
        const button = event.relatedTarget;
        document.getElementById("ubahNama").value = button.getAttribute("data-bs-nama");
        document.getElementById("ubahJenis").value = button.getAttribute("data-bs-jenis");
        document.getElementById("ubahKKM").value = button.getAttribute("data-bs-kkm");
      });

      // isi otomatis modal hapus
      const modalHapus = document.getElementById("modalHapus");
      modalHapus.addEventListener("show.bs.modal", (event) => {
        const button = event.relatedTarget;
        document.getElementById("hapusNama").textContent = button.getAttribute("data-bs-nama");
      });
    </script>
  </body>
</html>
